# Режим обмена для памяти с разными размерами секторов (внутренняя + SPI Flash)
CONFIG_BOOT_SWAP_USING_SCRATCH=y

# Отключаем криптографическую подпись (проверяем только целостность SHA-256)
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# Драйверы для чтения image-1 из внешней флеш W25Q32
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y

# Логи загрузчика в вашу консоль usart3
CONFIG_LOG=y
CONFIG_MCUBOOT_LOG_LEVEL_DBG=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SIZE_OPTIMIZATIONS=y
