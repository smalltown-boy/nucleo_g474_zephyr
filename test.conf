# Здесь просто настраивается консоль
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Включение интерактивного шелла
CONFIG_SHELL=y
CONFIG_UART_SHELL=y

# Настройки для корректной работы ОС (важно для minimal)
CONFIG_MULTITHREADING=y

# Включение механизма для отслеживания состояния задач
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

# Включение GPIO
CONFIG_GPIO=y


