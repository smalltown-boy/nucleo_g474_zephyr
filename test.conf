# Консоль и Shell
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_UART_SHELL=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_DEVICE_SHELL=y

# Ядро и стеки (КРИТИЧНО для minimal + LittleFS!)
CONFIG_MULTITHREADING=y
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_HW_STACK_PROTECTION=y

CONFIG_ETH_W5500_RX_THREAD_STACK_SIZE=2048

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048

# Логирование (IMMEDIATE покажет ошибку сразу в UART, если что-то пойдёт не так)
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SHELL_LOG_BACKEND=y

# Периферия: GPIO, SPI, Flash W25Qxx и LittleFS
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FLASH_SHELL=y
CONFIG_FLASH_JESD216_API=y

# Оключение трассировки через SWD
CONFIG_DEBUG=n

# Включаем чип W5500
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_W5500=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SHELL=y
CONFIG_LOG=y
CONFIG_ETHERNET_LOG_LEVEL_INF=y




