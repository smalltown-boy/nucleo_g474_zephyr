# Здесь просто настраивается консоль
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Включение интерактивного шелла
CONFIG_SHELL=y
CONFIG_UART_SHELL=y

# Настройки для корректной работы ОС (важно для minimal)
CONFIG_MULTITHREADING=y

# Включение механизма для отслеживания состояния задач
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

# Включение GPIO
CONFIG_GPIO=y

# Включаем ситему логирования
CONFIG_LOG=y
# CONFIG_LOG_MODE_IMMEDIATE=y # Это нужно для того, чтобы производить логирование прямо из контекста задачи

# Буст для системы логирования: выбрасываем сообщение в буфер и подхватываем его оттуда через 10 мс
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BUFFER_SIZE=2048

CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SHELL_LOG_BACKEND=y

